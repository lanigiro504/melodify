# =============================================================================
# 本地联调 Suno（本文件可安全提交）
#
# 做法：复制为同目录 application-local.yml（已由 .gitignore 排除）。
# Spring Boot 会在 application.yml 中通过 spring.config.import=optional:classpath:application-local.yml 自动加载，无需再加 profile。
#
# 【或】仅用环境变量：SUNO_API_KEY + MELODIFY_MUSIC_GENERATION_PROVIDER=suno
#
# 创作页只调本平台 /api ，Bearer 只应在后端请求 Suno；不要把密钥写进 melodify-client。
# =============================================================================
melodify:
  music-generation:
    provider: suno
  suno:
    # 不要用仓库里的占位符提交密钥；可复制为 application-local.yml 后填写或使用环境变量 SUNO_API_KEY
    api-key: "YOUR_SUNO_API_KEY"
