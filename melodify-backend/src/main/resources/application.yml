# 项目基础配置
spring:
  application:
    name: melodify-backend 

  # 可选加载本路径下的 application-local.yml（已由 .gitignore 排除，仅存本机密钥/联调项）
  config:
    import: optional:classpath:application-local.yml

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

  # 数据库连接配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/melodify?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: root 

  # JSON 处理配置 (针对 SQL 中的 JSON 字段)
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true # 开启驼峰命名转换（如 user_id 映射为 userId）
    # 如需排查 SQL，可在 application-local.yml 中临时开启：
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: is_deleted # 全局逻辑删除字段名
      logic-delete-value: 1          # 逻辑已删除值
      logic-not-delete-value: 0      # 逻辑未删除值

# 服务端配置
server:
  port: 8080

# JWT：生产环境务必用环境变量覆盖 secret，避免仓库泄露
# music-generation：扣费点数与异步模拟耗时；占位音频仅供联调
melodify:
  # 模拟支付回调验签（可与环境变量 MELODIFY_SIMULATED_PAY_HMAC_SECRET 覆盖）
  payment:
    simulated:
      hmac-secret: ${MELODIFY_SIMULATED_PAY_HMAC_SECRET:melodify-simulated-pay-secret}
  # C 端用户：注册赠送积分（≤0 等价于不设赠送，仅用支付/管理员调账兜底）
  user:
    signup-bonus-points: 300
  security:
    jwt:
      secret: "dev-melodify-jwt-change-in-production-use-long-random-secret"
      expiration-hours: 12
  music-generation:
    generate-cost-points: 10
    simulate-delay-ms: 2500
    placeholder-audio-url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"
    # auto=有 melodify.suno.api-key 则走 Suno，否则占位；suno/simulated 见代码注释
    provider: auto
  suno:
    api-base-url: https://api.sunoapi.org/api/v1
    # 优先环境变量 SUNO_API_KEY；也可在已忽略的 application-local.yml 中写 api-key
    api-key: ${SUNO_API_KEY:}
    poll-interval-ms: 15000
    max-wait-ms: 600000
    callback-url: ""
    # 与 callBackUrl 一并使用：自动附加 ?token=；回调请求需带相同 query
    callback-token: ""
    recovery-fixed-delay-ms: 120000
    default-model: V4_5
  # 将 Suno 返回的 http(s) MP3 镜像到本地目录，播放地址变为 /api/media/audio/{assetId}.mp3
  audio-storage:
    enabled: false
    local-dir: data/melodify-audio
    public-uri-prefix: /api/media/audio

  avatar-storage:
    local-dir: data/melodify-avatars
    public-uri-prefix: /api/media/avatar
    max-bytes: 2097152